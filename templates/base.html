<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}SISNEO | Suporte em Redes, Servidores e Azure em Porto Alegre | 20+ Anos{% endblock %}</title>
<meta name="description" content="{% block description %}Suporte em redes, servidores, firewall, migração para Azure e agentes de IA para empresas em Porto Alegre, RS e todo o Brasil. Atendimento direto com Giani Maldaner, 20+ anos, MCSE, Cisco e Azure.{% endblock %}">
<meta name="author" content="Giani Maldaner - SISNEO">
<meta name="geo.region" content="BR-RS">
<meta name="geo.placename" content="Porto Alegre">
<meta name="geo.position" content="-30.0346;-51.2177">
<meta name="ICBM" content="-30.0346, -51.2177">
<link rel="preconnect" href="{{ SITE_URL }}">
<link rel="dns-prefetch" href="{{ SITE_URL }}">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<meta name="robots" content="{% block robots %}index, follow, max-image-preview:large{% endblock %}">
{% block canonical %}<link rel="canonical" href="{{ SITE_URL }}/">{% endblock %}
<meta name="theme-color" content="#171310">
<link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ asset('favicon.svg') }}">
<link rel="stylesheet" href="{{ asset('css/style.css') }}">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="SISNEO - Suporte de TI Porto Alegre">
{% block head %}{% endblock %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ SITE_URL }}/#website",
  "name": "SISNEO - Suporte de TI, Redes Cisco e Azure em Porto Alegre",
  "url": "{{ SITE_URL }}/",
  "inLanguage": "pt-BR",
  "publisher": {"@id": "{{ SITE_URL }}/#organization"},
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ SITE_URL }}/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
</head>
<body class="{% block bodyclass %}{% endblock %}">
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
{% block body %}{% endblock %}
<script src="{{ asset('js/main.js') }}" defer></script>
</body>
</html>
